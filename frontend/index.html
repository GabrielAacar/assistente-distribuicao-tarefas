<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidor de Tarefas - Team Balancer</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p id="loadingText">Processando...</p>
    </div>

    <div id="alertModal" class="modal-backdrop">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Título do Alerta</h3>
                <span class="close-modal" onclick="fecharModal()">&times;</span>
            </div>
            <div class="modal-body">
                <p id="modalMessage">Mensagem do alerta aqui...</p>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" onclick="fecharModal()">Entendi</button>
            </div>
        </div>
    </div>

    <header>
        Distribuidor de Tarefas PSL (TN5250 Automation)
    </header>

    <aside>
        <h3>Configuração</h3>
        
        <div style="margin-bottom: 15px;">
            <label for="usersPerRefInput" style="color:white; font-size: 0.9rem;">Usuários por Dt Ref</label>
            <input type="number" id="usersPerRefInput" value="3" min="1" style="width: 100%; padding: 5px; border-radius: 4px; border:none;">
        </div>

        <div style="margin-bottom: 20px; border-top: 1px solid #465c71; padding-top: 10px;">
            <label style="color:white; font-size: 0.9rem; margin-bottom:5px;">Credenciais WMS</label>
            <input type="text" id="authUsername" placeholder="Usuário" style="width: 100%; padding: 5px; border-radius: 4px; border:none; margin-bottom: 5px;">
            <input type="password" id="authPassword" placeholder="Senha" style="width: 100%; padding: 5px; border-radius: 4px; border:none;">
            <small style="color: #bdc3c7; font-size: 0.7rem;">Usado apenas para gerar o script.</small>
        </div>

        <h3>Usuários Disponíveis</h3>
        <div class="user-input-group">
            <input type="text" id="newUserInput" placeholder="Nome do usuário">
            <button class="btn-add" onclick="adicionarUsuario()">+</button>
        </div>
        <ul id="userList">
            </ul>
        <div class="sidebar-footer">
            <p>Configurações salvas automaticamente.</p>
        </div>
    </aside>

    <main>
        
        <div class="card">
            <div class="card-header-row">
                <label for="jsonInput">1. Entrada de Tarefas (JSON Array)</label>
                <button class="btn-small-action" onclick="carregarDadosExemplo()" title="Carregar dados de teste">
                    ↻ Carregar Exemplo
                </button>
            </div>
            <textarea id="jsonInput" placeholder="Cole seu JSON aqui ou clique em 'Carregar Exemplo' para testar..."></textarea>
        </div>

        <div class="card">
            <label for="filterInput">2. Filtro de Locais (Opcional)</label>
            <input type="text" id="filterInput" placeholder="Ex: STG408, HR1. Deixe vazio para processar tudo.">
        </div>

        <div class="actions">
            <button class="btn-primary" onclick="processarDistribuicao()">Distribuir Tarefas e Gerar Script</button>
        </div>

        <div id="statusMessage" class="status-msg"></div>

        <div id="tableContainer" class="card" style="display: none;">
            <label>Visualização da Distribuição</label>
            <div class="table-responsive">
                <table id="distributionTable">
                    <thead>
                        <tr>
                            <th>Dt Ref</th>
                            <th>Prioridade</th>
                            <th>ID Tarefa</th>
                            <th>Local</th>
                            <th>Usuário</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="outputContainer" class="card">
            <label>Script Gerado (Automação Terminal)</label>
            <pre id="pslOutput"></pre>
        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
